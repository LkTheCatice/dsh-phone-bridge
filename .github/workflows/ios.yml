name: DSHRemote unsigned IPA

# Manual trigger only — no longer runs on push.
#
# 2026-11-12 lesson: `on: push paths: ios/**` fired a macOS runner for every
# push. Eight pushes that evening burned through the quota; after that every
# run was either a 2-second failure or cancelled outright, with log blobs
# already gone. Net effect: the Codemagic build we were watching sat in the
# queue while this workflow quietly drained the GitHub quota.
#
# Division of labour now: Codemagic is the primary builder. This workflow is a
# manual fallback — click "Run workflow" in the Actions tab when needed.
on:
  workflow_dispatch:

# Keep at most one run per branch so failed attempts don't pile up.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/DSHRemote
        run: xcodegen generate

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build (no code signing)
        working-directory: ios/DSHRemote
        run: |
          # Stamp commit sha + run number into Info.plist so the app reports
          # which build it is; tee to build.log so a failure can still be
          # inspected as an artifact (gh log blobs expire).
          set -o pipefail
          xcodebuild \
            -project DSHRemote.xcodeproj \
            -scheme DSHRemote \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            MARKETING_VERSION="${GITHUB_SHA::7}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
          grep -E "error:" build.log > errors.txt || true
          test ! -s errors.txt

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            ios/DSHRemote/build.log
            ios/DSHRemote/errors.txt
          retention-days: 7

      - name: Package unsigned IPA
        working-directory: ios/DSHRemote
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/DSHRemote.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry DSHRemote-unsigned.ipa Payload
          ls -lh DSHRemote-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSHRemote-unsigned-ipa
          path: ios/DSHRemote/DSHRemote-unsigned.ipa
          retention-days: 30