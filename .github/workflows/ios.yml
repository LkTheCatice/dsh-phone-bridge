name: DSHRemote unsigned IPA

# 只手动触发，不再跟随 push。
#
# 原因（2026-11-12 血的教训）：
# 之前配了 on: push paths: ios/**，意味着每次改代码 push 都会烧一次
# macOS runner 额度。那天为了验证一个改动 push 了 8 次，把额度烧穿 ——
# 之后所有 run 都是 2 秒失败 / 直接被取消，日志 blob 也没了，
# 结果「自己触发的 Codemagic 在排队，没注意到的 GH Actions 在烧额度」，
# 白了快一个小时。
#
# 现在的分工：Codemagic 负责日常构建（它是主力），
# GH Actions 只作为手动备选 —— 需要时在网页上点 "Run workflow"。
on:
  workflow_dispatch:

# 同一分支只留最新一次，避免排队堆叠
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/DSHRemote
        run: xcodegen generate

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build (no code signing)
        working-directory: ios/DSHRemote
        run: |
          # 把 commit 短 sha 与 run 号写进 Info.plist，App 启动时上报，
          # 日志里就能看到手机上跑的到底是哪一版
          # tee 到文件：失败时把完整编译输出作为 artifact 上传，
          # 否则 gh 的日志 blob 过期后完全取不到报错（2026-11-12 因此白查了四轮）
          set -o pipefail
          xcodebuild \
            -project DSHRemote.xcodeproj \
            -scheme DSHRemote \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            MARKETING_VERSION="${GITHUB_SHA::7}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
          grep -E "error:" build.log > errors.txt || true
          test ! -s errors.txt

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            ios/DSHRemote/build.log
            ios/DSHRemote/errors.txt
          retention-days: 7

      - name: Package unsigned IPA
        working-directory: ios/DSHRemote
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/DSHRemote.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry DSHRemote-unsigned.ipa Payload
          ls -lh DSHRemote-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSHRemote-unsigned-ipa
          path: ios/DSHRemote/DSHRemote-unsigned.ipa
          retention-days: 30
