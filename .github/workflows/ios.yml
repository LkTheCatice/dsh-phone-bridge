name: DSHRemote unsigned IPA

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/DSHRemote
        run: xcodegen generate

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build (no code signing)
        working-directory: ios/DSHRemote
        run: |
          xcodebuild \
            -project DSHRemote.xcodeproj \
            -scheme DSHRemote \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        working-directory: ios/DSHRemote
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/DSHRemote.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry DSHRemote-unsigned.ipa Payload
          ls -lh DSHRemote-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSHRemote-unsigned-ipa
          path: ios/DSHRemote/DSHRemote-unsigned.ipa
          retention-days: 30
