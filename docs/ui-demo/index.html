<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DSH Helm · UI 复刻（用于录屏/宣传片）</title>
<style>
  /* ──────────────────────────────────────────────────────────
     设计令牌：全部取自 iOS 代码，别改数值
     · 系统色：secondarySystemBackground / secondaryLabel / tertiaryLabel
     · 气泡：radius 14，内边距 10/6，用户消息左边界 56pt
     · log 行：等宽 12pt、secondaryLabel、行首 "> "
     · 卡片（产物/折叠）：radius 9，上下 8 / 左右 12，最小高 32，字 13 medium
     ────────────────────────────────────────────────────────── */
  :root{
    --accent:#0a84ff;
    --bg:#ffffff;
    --bg-secondary:#f2f2f7;
    --fill:rgba(118,118,128,.12);
    --label:#000;
    --secondary-label:rgba(60,60,67,.6);
    --tertiary-label:rgba(60,60,67,.3);
    --separator:rgba(60,60,67,.18);
    --green:#34c759;
    --radius-phone:44px;
  }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased}
  html,body{height:100%;margin:0}
  body{
    display:flex;align-items:center;justify-content:center;gap:36px;
    background:#0d0f12;color:#fff;
    font-family:-apple-system,"SF Pro Text","PingFang SC","Segoe UI",Roboto,sans-serif;
  }

  /* 手机外框：逻辑尺寸 393×852（iPhone 15 Pro） */
  .phone{
    position:relative;width:393px;height:852px;border-radius:var(--radius-phone);
    background:var(--bg);color:var(--label);overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.55), 0 0 0 10px #1b1d21, 0 0 0 11px #2c2f35;
    flex:0 0 auto;
  }
  .statusbar{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-size:15px;font-weight:600}
  .statusbar .right{display:flex;align-items:center;gap:6px;font-size:13px}

  /* 顶部导航 */
  .nav{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
  .nav .icon{width:38px;height:38px;border-radius:19px;background:var(--fill);display:grid;place-items:center;font-size:16px}
  .nav .title{font-size:17px;font-weight:600;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* 消息区 */
  .scroll{position:absolute;inset:116px 0 150px 0;overflow:hidden;padding:0 16px}
  .rows{display:flex;flex-direction:column;gap:7px}

  .system-row{text-align:center;font-size:10.5px;color:var(--secondary-label);opacity:.62;padding:6px 0}

  .bubble{max-width:100%;border-radius:14px;padding:8px 12px;font-size:16px;line-height:1.5;background:var(--bg-secondary)}
  .bubble.user{
    align-self:flex-end;margin-left:56px;background:rgba(10,132,255,.11);
  }
  .prefix{font-size:12px;font-weight:600;color:var(--tertiary-label);margin-bottom:7px}
  .bubble.user .prefix{color:rgba(10,132,255,.55);text-align:right}

  /* log 行（工具 / 思考）：等宽 12，灰色，行首 > */
  .log{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:12px;line-height:1.35;color:var(--secondary-label);white-space:normal;
  }
  .log .caret{color:var(--tertiary-label);font-weight:600}
  .log.thinking .body{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }

  /* 卡片行：产物 / 折叠 */
  .chip{
    min-height:32px;border-radius:9px;background:var(--fill);
    display:flex;align-items:center;padding:8px 12px;
    font-size:13px;font-weight:500;line-height:1.25;
  }
  .chip.file{color:var(--label)}
  .chip.fold{color:var(--accent);cursor:pointer;transition:transform .12s ease, background .12s ease}
  .chip.fold:active{transform:scale(.985)}

  /* AI 回答里的富文本 */
  .bubble h2{font-size:20px;margin:10px 0 6px}
  .bubble p{margin:8px 0}
  .codeblock{
    background:var(--fill);border-radius:8px;padding:8px 10px;margin:10px 0;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.45;
    white-space:pre-wrap;color:var(--label);
  }
  .table{background:var(--fill);border-radius:8px;padding:8px 10px;margin:10px 0;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.5;color:var(--secondary-label)}
  .table .th{color:var(--label);font-weight:600;border-bottom:1px solid var(--separator);padding-bottom:5px;margin-bottom:5px}
  .table .tr{display:grid;grid-template-columns:1.1fr 1fr 1.4fr;gap:6px}

  /* 底栏：状态两行 + 对话/设置 */
  .composer{position:absolute;left:0;right:0;bottom:0;background:rgba(249,249,249,.97);backdrop-filter:blur(20px);padding:8px 12px 6px}
  .inputrow{display:flex;align-items:center;gap:8px}
  .plus{width:26px;height:26px;border-radius:13px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:17px;font-weight:600}
  .field{flex:1;height:36px;border-radius:18px;background:var(--fill);display:flex;align-items:center;padding:0 14px;color:var(--tertiary-label);font-size:16px}
  .send{width:30px;height:30px;border-radius:15px;background:var(--fill);display:grid;place-items:center;color:var(--tertiary-label);font-size:16px}
  .bottombar{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 2px}
  .status{display:flex;flex-direction:column;gap:3px}
  .status .line{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--secondary-label)}
  .dot{width:6px;height:6px;border-radius:3px}
  .dot.on{background:var(--green)} .dot.off{background:#8e8e93}
  .tabs{display:flex;gap:2px;padding:3px;background:rgba(118,118,128,.10);border-radius:22px}
  .tab{width:58px;height:36px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:var(--secondary-label)}
  .tab.active{background:rgba(10,132,255,.12);color:var(--accent)}
  .tab .gl{font-size:15px;line-height:1}

  /* 开屏覆盖层：实色底 + 轻渐变 */
  .launch{position:absolute;inset:0;background:var(--bg);display:grid;place-items:center;z-index:20}
  .launch .veil{position:absolute;inset:0;background:linear-gradient(135deg,rgba(10,132,255,.10),rgba(255,255,255,0) 55%,rgba(10,132,255,.06))}
  .launch .inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;
    transform:scale(.94);opacity:0;transition:transform .42s cubic-bezier(.2,.9,.25,1.06),opacity .2s linear}
  .launch.in .inner{transform:scale(1);opacity:1}
  .launch .mark{width:96px;height:96px;border-radius:48px;background:rgba(10,132,255,.14);display:grid;place-items:center;font-size:38px;color:var(--accent)}
  .launch .t1{font-size:17px;font-weight:600}
  .launch .t2{font-size:12px;color:var(--secondary-label);margin-top:4px}
  .launch .titles{text-align:center;opacity:0;transition:opacity .22s ease .06s}
  .launch.in .titles{opacity:1}
  .launch.leaving{opacity:0;transform:scale(1.06);transition:opacity .5s ease,transform .5s ease}

  /* “本轮过程”页 / 步骤详情页 */
  .sheet{position:absolute;inset:0;background:var(--bg-secondary);z-index:30;transform:translateY(100%);transition:transform .34s cubic-bezier(.32,.72,0,1)}
  .sheet.show{transform:translateY(0)}
  .sheet .head{height:56px;display:flex;align-items:center;justify-content:center;position:relative;font-weight:600;font-size:16px;background:var(--bg-secondary)}
  .sheet .head .close{position:absolute;right:16px;font-size:15px;color:var(--accent);font-weight:500}
  .card{background:var(--bg);border-radius:12px;margin:12px 16px;overflow:hidden}
  .card .r{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:13px}
  .card .r + .r{border-top:.5px solid var(--separator)}
  .card .r .idx{font-family:ui-monospace,Menlo;font-size:11px;color:var(--tertiary-label);width:18px;text-align:right}
  .card .r .ico{width:14px;font-size:11px;color:var(--secondary-label)}
  .card .r .txt{flex:1;min-width:0}
  .card .r .name{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .r .sum{font-size:11px;color:var(--secondary-label);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .r .ok{color:var(--green);font-size:11px}
  .card .r.tap{cursor:pointer}
  .card .r.tap:active{background:rgba(118,118,128,.08)}
  .sheet .sec{font-size:13px;color:var(--secondary-label);padding:4px 28px 6px}
  .detail{position:absolute;inset:0;background:var(--bg);z-index:40;transform:translateX(100%);transition:transform .28s ease}
  .detail.show{transform:translateX(0)}
  .detail .body{padding:16px;font-size:13px}
  .detail .mono{font-family:ui-monospace,Menlo;font-size:11px;color:var(--label);white-space:pre-wrap;
    background:var(--fill);border-radius:8px;padding:10px;margin-top:10px;line-height:1.5}
  .detail .img{margin-top:12px;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#cfe4ff,#eef3f8);height:200px;display:grid;place-items:center;color:#5a7fa8;font-size:12px}

  /* 控制面板（不进画面） */
  .panel{width:270px;display:flex;flex-direction:column;gap:10px;font-size:13px;color:#c9d1d9}
  .panel h1{font-size:15px;margin:0 0 4px;color:#fff}
  .panel button{all:unset;background:#1b1f26;border:1px solid #2c313a;border-radius:8px;padding:8px 10px;cursor:pointer;text-align:center}
  .panel button:hover{background:#232933}
  .panel .hint{font-size:11px;line-height:1.6;color:#8b949e}
  @media (max-width:820px){ .panel{display:none} }
</style>
</head>
<body>

<div class="phone" id="phone">
  <div class="statusbar">
    <span id="clock">9:41</span>
    <span class="right">▮▮▮ ⌁ 100%</span>
  </div>

  <div class="nav">
    <div class="icon">▤</div>
    <div class="title">检查并修复最近的工作流</div>
    <div class="icon">⋯</div>
  </div>

  <div class="scroll">
    <div class="rows" id="rows"></div>
  </div>

  <div class="composer">
    <div class="inputrow">
      <div class="plus">+</div>
      <div class="field" id="draft">让它跑点什么…</div>
      <div class="send">↑</div>
    </div>
    <div class="bottombar">
      <div class="status">
        <div class="line"><span class="dot on"></span><span>已连接</span></div>
        <div class="line"><span class="dot on"></span><span>画图空闲</span></div>
      </div>
      <div class="tabs">
        <div class="tab active"><span class="gl">💬</span><span>对话</span></div>
        <div class="tab"><span class="gl">⚙</span><span>设置</span></div>
      </div>
    </div>
  </div>

  <!-- 本轮过程 -->
  <div class="sheet" id="turnlog">
    <div class="head">本轮过程<span class="close" onclick="Demo.closeTurnLog()">关闭</span></div>
    <div class="card">
      <div class="r"><span class="idx">#</span><span style="flex:1;font-size:12px">第 120 轮</span>
        <span style="font-size:11px;color:var(--tertiary-label)" id="tl-count">思考 3 · 工具 4</span></div>
    </div>
    <div class="sec">过程 · <span id="tl-steps">7</span> 步</div>
    <div class="card" id="tl-list"></div>
  </div>
  <!-- 步骤详情 -->
  <div class="detail" id="detail">
    <div class="head" style="background:var(--bg)">步骤详情<span class="close" onclick="Demo.closeDetail()">返回</span></div>
    <div class="body">
      <div style="font-size:13px;font-weight:500" id="d-title">运行命令</div>
      <div style="font-size:11px;color:var(--secondary-label);margin-top:4px" id="d-sum">…</div>
      <div class="mono" id="d-out">…</div>
      <div class="img" id="d-img" style="display:none">（这里放电脑侧读过的图片 900px 预览）</div>
    </div>
  </div>

  <!-- 开屏 -->
  <div class="launch" id="launch">
    <div class="veil"></div>
    <div class="inner">
      <div class="mark">💬</div>
      <div class="titles">
        <div class="t1">DSH Helm</div>
        <div class="t2">连接你的 DeepSeek Harness</div>
      </div>
    </div>
  </div>
</div>

<div class="panel">
  <h1>场景控制</h1>
  <button onclick="Demo.replayLaunch()">① 重放开屏（2.3s）</button>
  <button onclick="Demo.askUser('我看下今天的改动')">② 我发一条消息</button>
  <button onclick="Demo.streamThinking()">③ 思考流式（2 行截断）</button>
  <button onclick="Demo.streamTools()">④ 工具行逐条</button>
  <button onclick="Demo.streamAnswer()">⑤ AI 回答流式</button>
  <button onclick="Demo.finishTurn()">⑥ 收尾 → 折叠卡片</button>
  <button onclick="Demo.openTurnLog()">⑦ 打开「本轮过程」</button>
  <button onclick="Demo.openStep(1)">⑧ 点开第 2 步</button>
  <button onclick="Demo.autoPlay(1)">▶ 自动播完整流程</button>
  <div class="hint">
    录制建议：浏览器缩放 200% → 只录手机框（或 Playwright 截 element）；
    面板不参与画面。所有数值取自 iOS 代码，见 docs/ui-demo/README.md。
  </div>
</div>

<script>
/* ─────────────────────────────────────────────────────────────
   一个极小的"导演 API"，给录屏脚本用：
   await Demo.replayLaunch(); await Demo.askUser('…'); …
   每个方法都返回 Promise，按顺序 await 就能拿到稳定的画面。
   ───────────────────────────────────────────────────────────── */
const rowsEl = document.getElementById('rows');
const sleep = ms => new Promise(r => setTimeout(r, ms));

const Demo = {
  /* ① 开屏：图标第一帧就在（scale .94→1），停留 2300ms，淡出 500ms */
  async replayLaunch({ dwell = 2300, fade = 500, scale = 1 } = {}) {
    const el = document.getElementById('launch');
    el.style.display = 'grid';
    el.classList.remove('in', 'leaving');
    void el.offsetWidth;
    el.classList.add('in');
    await sleep(dwell);
    el.classList.add('leaving');
    await sleep(fade);
    el.style.display = 'none';
    el.classList.remove('in', 'leaving');
  },

  /* ② 我发一条消息（右侧气泡，左边界 56pt，淡蓝底） */
  async askUser(text) {
    const el = document.createElement('div');
    el.className = 'bubble user';
    el.innerHTML = `<div class="prefix">▍我</div><div>${escapeHtml(text)}</div>`;
    rowsEl.appendChild(el);
    await sleep(220);
    return el;
  },

  /* ③ 思考行：等宽 12、两行截断（第二行放不下才省略，交给 CSS clamp） */
  async streamThinking(text = '用户想确认这一轮的过程页，先把日志收敛成一行，再看他点开的是哪一步。') {
    const el = document.createElement('div');
    el.className = 'log thinking';
    el.innerHTML = `<span class="caret">&gt; </span><span class="body"></span>`;
    rowsEl.appendChild(el);
    const body = el.querySelector('.body');
    const pre = document.createTextNode('思考 · ');
    body.appendChild(pre);
    for (const ch of text) {
      body.appendChild(document.createTextNode(ch));
      await sleep(12);
    }
    return el;
  },

  /* ④ 工具行：逐条出现 */
  async streamTools(items = [
    ['读取', 'uploads/1794560546-image-1794560546-0.jpg'],
    ['运行命令', 'Verify the build artifact'],
    ['写入', 'docs/KNOWN-GOOD.md'],
  ]) {
    for (const [name, summary] of items) {
      const el = document.createElement('div');
      el.className = 'log';
      el.innerHTML = `<span class="caret">&gt; </span>${escapeHtml(name)} · ${escapeHtml(summary)}`;
      rowsEl.appendChild(el);
      await sleep(260);
    }
  },

  /* ⑤ AI 回答：markdown 里只复刻观感（标题/段落/代码块/表格块） */
  async streamAnswer(md) {
    const el = document.createElement('div');
    el.className = 'bubble';
    el.innerHTML = `<div class="prefix">▍AI</div>`;
    rowsEl.appendChild(el);
    const html = md || `
      <h2>开屏时间定了</h2>
      <p>停留 2.3 秒，淡出 0.5 秒；图标第一帧就在，所以从系统白屏过来是连续的。</p>
      <div class="codeblock">minDwell = 2.3
maxWait  = 3.5
paint    = opacity(.5s) + scale(1.06)</div>
      <div class="table">
        <div class="th tr"><span>区域</span><span>状态</span><span>说明</span></div>
        <div class="tr"><span>运行中</span><span>逐条显示</span><span>思考 / 工具同格式</span></div>
        <div class="tr"><span>结束后</span><span>折成一行</span><span>▸ 本轮过程 · N 步</span></div>
      </div>
      <p>冷启动贴底、去重、图片入口都已修好。</p>`;
    el.insertAdjacentHTML('beforeend', html);
    await sleep(400);
    return el;
  },

  /* ⑥ 收尾：过程行收成一张折叠卡片 */
  async finishTurn({ steps = 7, seconds = '3 分 12 秒' } = {}) {
    const logs = [...rowsEl.querySelectorAll('.log')];
    for (const l of logs) { l.style.transition = 'opacity .18s ease, transform .18s ease'; l.style.opacity = '0'; l.style.transform = 'scale(.98)'; }
    await sleep(180);
    logs.forEach(l => l.remove());

    const fold = document.createElement('div');
    fold.className = 'chip fold';
    fold.textContent = `▸ 本轮过程 · ${steps} 步 ›`;
    fold.onclick = () => Demo.openTurnLog();
    rowsEl.appendChild(fold);

    const end = document.createElement('div');
    end.className = 'system-row';
    end.textContent = `本轮结束 · 用时 ${seconds} · ${steps} 步`;
    rowsEl.appendChild(end);
    await sleep(240);
    return fold;
  },

  /* ⑦ 本轮过程页 */
  async openTurnLog(entries) {
    const list = document.getElementById('tl-list');
    const data = entries || [
      ['思考', '先确认这一轮的日志结构', true],
      ['运行命令', 'Verify the build artifact', true],
      ['读取', 'uploads/1794560546-image-1794560546-0.jpg', true],
      ['写入', 'docs/KNOWN-GOOD.md', true],
      ['运行命令', 'Commit and push', true],
      ['思考', '回读一遍改动有没有漏', true],
      ['写入', 'dist/DSHRemote-unsigned.ipa', true],
    ];
    document.getElementById('tl-steps').textContent = data.length;
    list.innerHTML = data.map(([name, sum, ok], i) => `
      <div class="r tap" onclick="Demo.openStep(${i})">
        <span class="idx">${i + 1}</span>
        <span class="ico">${name === '思考' ? '🧠' : '🔧'}</span>
        <span class="txt"><div class="name">${escapeHtml(name)}</div><div class="sum">${escapeHtml(sum)}</div></span>
        <span class="ok">${ok ? '✔' : ''}</span>
      </div>`).join('');
    document.getElementById('turnlog').classList.add('show');
    await sleep(340);
  },

  closeTurnLog() {
    document.getElementById('turnlog').classList.remove('show');
    document.getElementById('detail').classList.remove('show');
  },

  /* ⑧ 步骤详情（带图片的步骤就显示图） */
  async openStep(index = 1, withImage = true) {
    const titles = ['思考', '运行命令', '读取', '写入', '运行命令', '思考', '写入'];
    document.getElementById('d-title').textContent = titles[index] || '步骤';
    document.getElementById('d-sum').textContent = index === 2 ? 'uploads/1794560546-image-1794560546-0.jpg' : '这一步的摘要';
    document.getElementById('d-out').textContent = index === 2
      ? '{\n  "type": "image",\n  "name": "1794560546-image-1794560546-0.jpg",\n  "width": 1408,\n  "height": 2048\n}'
      : '[status: completed, exit code: 0]\nBuild success · VERIFY_OK';
    document.getElementById('d-img').style.display = (index === 2 && withImage) ? 'grid' : 'none';
    document.getElementById('detail').classList.add('show');
    await sleep(300);
  },

  closeDetail() {
    document.getElementById('detail').classList.remove('show');
  },

  /* ▶ 一条完整的宣传片脚本（可直接录） */
  async autoPlay(speed = 1) {
    rowsEl.innerHTML = '';
    const s = ms => sleep(ms / speed);
    await Demo.replayLaunch({ dwell: 2300 / speed });
    await Demo.askUser('我看下今天的改动');
    await s(200);
    await Demo.streamThinking();
    await Demo.streamTools();
    await Demo.streamAnswer();
    await s(500);
    await Demo.finishTurn();
    await s(400);
    await Demo.openTurnLog();
    await s(600);
    await Demo.openStep(2);
  },
};

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* 时钟 */
(function tick() {
  const d = new Date();
  document.getElementById('clock').textContent = `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
  setTimeout(tick, 20000);
})();

/* ?autoplay=1 直接跑完整流程（方便 Playwright 录屏） */
if (new URLSearchParams(location.search).get('autoplay') === '1') {
