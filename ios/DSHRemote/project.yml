name: DSHRemote
options:
  bundleIdPrefix: dev.yg
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"

targets:
  DSHRemote:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Resources/Info.plist
      properties:
        # 版本号必须能在日志里看到 —— 之前一直分不清手机上跑的是哪一版，
        # 白白浪费好几轮（把 20 秒卡顿归到已经修过的代码上）。
        # CI 会传 MARKETING_VERSION=<git 短 sha>、CURRENT_PROJECT_VERSION=<run 号>，
        # App 启动时把这两个值上报成 `build=xxxxxxx.42`。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 主屏显示名。「DSH Helm」8 字符能完整显示不被截断；
        # 产物名 PRODUCT_NAME 仍是 DSHRemote（改了会让 .app 目录名变、CI 路径要跟着改）
        CFBundleDisplayName: DSH Helm
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: 用于连接你电脑上的 DeepSeek Harness 桥接服务（局域网直连时）
        # 看图时「保存到相册」需要它，缺了会在写入那一刻闪退
        NSPhotoLibraryAddUsageDescription: 把电脑传来的图片保存到相册
        # 下载的文件要能在「文件」App → 我的 iPhone → DSH Helm 里看到，
        # 否则存进沙盒等于拿不出来
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # 注册为「用其他应用打开」的处理程序：微信「更多 → 用其他应用打开」、
        # QQ「其他应用打开」都能把文件直接递进来（Share Extension 需要 App Groups，
        # 免费签名拿不到，所以走这条原生通道）
        CFBundleDocumentTypes:
          - CFBundleTypeName: 任意文件
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.data
              - public.image
              - public.movie
              - public.audio
        # 局域网走 HTTP，但每个请求体都是端到端加密的；外网请走 Tailscale 的 HTTPS
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yg.dshremote
        PRODUCT_NAME: DSHRemote
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
        # 应用图标（Sources/Assets.xcassets/AppIcon.appiconset/icon-1024.png）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
